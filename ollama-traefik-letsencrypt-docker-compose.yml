# Image pins live HERE, as interpolation defaults, so `git pull` (or
# re-downloading this file) delivers the exact version combination this
# repository has tested — no .env editing required. Setting the matching
# variable in .env overrides the default for anyone who wants to pin
# differently; .env itself carries only secrets and deliberate overrides.
# CI (Trivy scans, check-pin-freshness, the ephemeral test .env) reads
# the pins from these lines — this block is the single source of truth.
x-images:
  traefik: &traefik-image ${TRAEFIK_IMAGE_TAG:-traefik:${TRAEFIK_IMAGE_VERSION:-3.7@sha256:c8a121e4bb1347e8fd52657fab12f2cb70b68f8a018895e2068f92c9e519b9c2}}
  ollama: &ollama-image ${OLLAMA_IMAGE_TAG:-ollama/ollama:${OLLAMA_IMAGE_VERSION:-0.40.10@sha256:4c5b27871a3239a717048f9b93057680a51b60c8119a7016aebb57f938e25e35}}
  webui: &webui-image ${WEBUI_IMAGE_TAG:-ghcr.io/open-webui/open-webui:${WEBUI_IMAGE_VERSION:-0.12.0@sha256:1565038903151ced924b5a3226f73f40f16963df4b910441f6391f10144afdaa}}

networks:
  traefik-network:
    external: true
  ollama-network:
    external: true

volumes:
  webui-data:
  ollama-data:
  traefik-certificates:
  open-webui-backups:

services:
  webui:
    image: *webui-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Resource limits as .env-overridable defaults (e.g. OPEN_WEBUI_MEMORY_LIMIT=2g);
    # the override survives every git pull. This is the interface, not the
    # model runner: its footprint does not move with model size.
    deploy:
      resources:
        limits:
          memory: ${OPEN_WEBUI_MEMORY_LIMIT:-1g}
          cpus: "${OPEN_WEBUI_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${OPEN_WEBUI_MEMORY_RESERVATION:-128m}
          cpus: "${OPEN_WEBUI_CPU_RESERVATION:-0.25}"
    volumes:
      - webui-data:/app/backend/data
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    networks:
      - ollama-network
      - traefik-network
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # Match incoming requests on a specific hostname
      - "traefik.http.routers.webui.rule=Host(`${OLLAMA_HOSTNAME:?set in .env - see .env.example}`)"
      # Assign the router to a named Traefik service
      - "traefik.http.routers.webui.service=webui"
      # Use the 'websecure' (HTTPS) entry point
      - "traefik.http.routers.webui.entrypoints=websecure"
      # Define the internal container port for routing
      - "traefik.http.services.webui.loadbalancer.server.port=8080"
      # Enable TLS on this router
      - "traefik.http.routers.webui.tls=true"
      # Use Let's Encrypt for certificate management
      - "traefik.http.routers.webui.tls.certresolver=letsencrypt"
      # Pass the original Host header to the container
      - "traefik.http.services.webui.loadbalancer.passhostheader=true"
      # Apply a compression middleware
      - "traefik.http.routers.webui.middlewares=compresstraefik"
      # Define settings for the compression middleware
      - "traefik.http.middlewares.compresstraefik.compress=true"
      # Specify which Docker network Traefik should use for routing
      - "traefik.docker.network=traefik-network"
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
      traefik:
        condition: service_healthy

  ollama:
    image: *ollama-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # conformance: allow-no-limits - the working set here is whichever model
    # you load, not anything this file can know. A 7B model at Q4 wants about
    # 5 GB resident and a 70B wants ten times that, so any ceiling shipped in
    # the template is a guess that becomes an OOM kill in the middle of
    # somebody's generation, on the pull that introduced it. Once you know
    # which models you run, add a deploy.resources.limits block here with
    # headroom above the largest of them.
    entrypoint: ["/usr/bin/bash", "/entrypoint.sh"]
    volumes:
      - ollama-data:/root/.ollama
      - ./entrypoint.sh:/entrypoint.sh
    environment:
      # `-`, not `:-`: set empty, it means pull nothing. With `:-` an empty
      # value fell back to the default, and the three models were pulled anyway.
      MODELS: ${OLLAMA_INSTALL_MODELS-llama3,codegemma,mistral}
    # Only the internal network: Open WebUI reaches Ollama here, and so does
    # Traefik, for the API route below when it is switched on. Never the
    # shared traefik-network, where every other stack on the host could call
    # the API with no credentials.
    networks:
      - ollama-network
    # Uncomment to enable NVIDIA GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: ${OLLAMA_GPU_COUNT:-all}
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      # THE API ONLY WHEN ASKED FOR, AND ONLY WITH A PASSWORD. Ollama's API has
      # no authentication of its own. Up to 1.x this template published it on
      # the host's port 11434 to whoever could reach the port. Now it is routed
      # only with OLLAMA_API_ENABLED=true: on its own hostname, over HTTPS,
      # behind basic auth. README, "Ollama's API from outside".
      - "traefik.enable=${OLLAMA_API_ENABLED:-false}"
      - "traefik.http.routers.ollama-api.rule=Host(`${OLLAMA_API_HOSTNAME:-ollama-api.invalid}`)"
      - "traefik.http.routers.ollama-api.entrypoints=websecure"
      - "traefik.http.routers.ollama-api.tls=true"
      - "traefik.http.routers.ollama-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ollama-api.service=ollama-api"
      - "traefik.http.routers.ollama-api.middlewares=ollama-api-auth"
      - "traefik.http.middlewares.ollama-api-auth.basicauth.users=${OLLAMA_API_BASIC_AUTH:-}"
      - "traefik.http.services.ollama-api.loadbalancer.server.port=11434"
      - "traefik.docker.network=ollama-network"
    restart: unless-stopped
    depends_on:
      traefik:
        condition: service_healthy

  traefik:
    image: *traefik-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443, chown its data directory, drop to
    # its service user).
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          memory: ${TRAEFIK_MEMORY_LIMIT:-256m}
          cpus: "${TRAEFIK_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${TRAEFIK_MEMORY_RESERVATION:-64m}
          cpus: "${TRAEFIK_CPU_RESERVATION:-0.1}"
    command:
      # Set the log level (DEBUG, INFO, WARN, ERROR)
      - "--log.level=${TRAEFIK_LOG_LEVEL:-WARN}"
      # Enable the built-in API and web-based dashboard
      - "--api.dashboard=true"
      # Enable the /ping endpoint so we can health-check Traefik
      - "--ping=true"
      # Assign the /ping endpoint to a dedicated entry point on port 8082
      - "--ping.entrypoint=ping"
      - "--entrypoints.ping.address=:8082"
      # Define the primary HTTP entry point on port 80
      - "--entrypoints.web.address=:80"
      # Define the secure (HTTPS) entry point on port 443
      - "--entrypoints.websecure.address=:443"
      # Timeouts on the HTTPS entry point. Unset, they are Traefik's own
      # defaults; set them in .env to tune (see .env.example).
      - "--entrypoints.websecure.transport.respondingTimeouts.readTimeout=${TRAEFIK_READ_TIMEOUT:-60s}"
      - "--entrypoints.websecure.transport.respondingTimeouts.writeTimeout=${TRAEFIK_WRITE_TIMEOUT:-0s}"
      - "--entrypoints.websecure.transport.respondingTimeouts.idleTimeout=${TRAEFIK_IDLE_TIMEOUT:-180s}"
      # HTTP -> HTTPS redirect at entrypoint level
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Enable the Docker provider to detect containers and their labels
      - "--providers.docker=true"
      # Point Traefik to the Docker socket
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      # Prevent automatic exposure of all containers; only expose containers
      # with "traefik.enable=true"
      - "--providers.docker.exposedbydefault=false"
      # Use ACME (Let's Encrypt) to generate/renew certificates via TLS challenge
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      # The email address used by Let's Encrypt for renewal notices
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:?set in .env - see .env.example}"
      # The file where ACME certificates are stored inside the container
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json"
      # Enable Prometheus metrics
      - "--metrics.prometheus=true"
      # Configure Prometheus histogram buckets
      - "--metrics.prometheus.buckets=0.1,0.3,1.2,5.0"
      # Check for newer Traefik versions and optionally log that info
      - "--global.checknewversion=true"
      # Disable sending anonymous usage data to the Traefik maintainers
      - "--global.sendanonymoususage=false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/etc/traefik/acme
    # traefik-network for the stacks it serves; ollama-network to reach
    # Ollama's API route, the only way to Ollama from outside the stack.
    networks:
      - traefik-network
      - ollama-network
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "wget", "http://localhost:8082/ping", "--spider"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # A router to expose the Traefik dashboard
      - "traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_HOSTNAME:?set in .env - see .env.example}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"
      # Basic Authentication for the Traefik dashboard
      - "traefik.http.routers.dashboard.middlewares=authtraefik"
      - "traefik.http.middlewares.authtraefik.basicauth.users=${TRAEFIK_BASIC_AUTH:?set in .env - see .env.example for htpasswd generation}"
      # Specify the internal server port to the dashboard service
      - "traefik.http.services.dashboard.loadbalancer.server.port=8080"
      # Pass the original Host header to the backend
      - "traefik.http.services.dashboard.loadbalancer.passhostheader=true"
    restart: unless-stopped

  backups:
    image: python:3.13-alpine@sha256:7415fbc3c9e4979cc717d92377ab2bc7b2b4a2af1ac03cc52b5f3f88efedaf3a
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's
    # entrypoint needs (bind :80/:443, chown its data directory, drop to
    # its service user).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    # Resource limits as .env-overridable defaults (e.g. OPEN_WEBUI_BACKUPS_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${OPEN_WEBUI_BACKUPS_MEMORY_LIMIT:-256m}
          cpus: "${OPEN_WEBUI_BACKUPS_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${OPEN_WEBUI_BACKUPS_MEMORY_RESERVATION:-32m}
          cpus: "${OPEN_WEBUI_BACKUPS_CPU_RESERVATION:-0.1}"
    # Every cycle: a consistent online copy of each SQLite database through
    # Python's backup API (no application stop), then a tar.gz of the rest of
    # the data directory (live database files excluded - the copies above are
    # the consistent ones). Logs OK/FAILED per artefact; a failed archive is
    # kept as .failed for diagnosis; retention 0 disables pruning.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep "$$OPEN_WEBUI_BACKUP_INIT_SLEEP"
        while true; do
          STAMP="$$(date +%Y-%m-%d_%H-%M)"
          for db in webui.db; do
            DB_FILE="$$OPEN_WEBUI_BACKUPS_PATH/$$OPEN_WEBUI_BACKUP_NAME-$${db%%.*}-$$STAMP.sqlite3"
            echo "[$$(date -Iseconds)] Starting database backup of $$db to $$DB_FILE.gz"
            if [ ! -f "/data/$$db" ]; then
              echo "[$$(date -Iseconds)] Database $$db not present yet (first start?) - skipped this cycle"
            elif python3 -c "import sqlite3,sys; s=sqlite3.connect('file:'+sys.argv[1]+'?mode=ro',uri=True); d=sqlite3.connect(sys.argv[2]); s.backup(d); d.close(); s.close()" "/data/$$db" "$$DB_FILE" && gzip -f "$$DB_FILE"; then
              echo "[$$(date -Iseconds)] Database backup OK: $$DB_FILE.gz ($$(stat -c %s "$$DB_FILE.gz") bytes)"
            else
              echo "[$$(date -Iseconds)] Database backup FAILED - $$db could not be copied consistently" >&2
              rm -f "$$DB_FILE" "$$DB_FILE.gz"
            fi
          done
          DATA_FILE="$$OPEN_WEBUI_BACKUPS_PATH/$$OPEN_WEBUI_DATA_BACKUP_NAME-$$STAMP.tar.gz"
          echo "[$$(date -Iseconds)] Starting data backup to $$DATA_FILE"
          tar -C /data --exclude='./webui.db' --exclude='./webui.db-wal' --exclude='./webui.db-shm' --exclude='./cache' -zcpf "$$DATA_FILE.partial" .; RC=$$?
          # BusyBox tar exits 1 for everything from "file changed" to "cannot
          # write", so the exit code proves nothing: read the archive back,
          # all of it: gzip -t would test the compression and not the tar inside.
          if [ "$$RC" -le 1 ] && [ -f "$$DATA_FILE.partial" ] && tar -tzf "$$DATA_FILE.partial" >/dev/null 2>&1; then
            mv "$$DATA_FILE.partial" "$$DATA_FILE";
            echo "[$$(date -Iseconds)] Data backup OK: $$DATA_FILE ($$(stat -c %s "$$DATA_FILE") bytes)"
          else
            echo "[$$(date -Iseconds)] Data backup FAILED - partial file kept as $$DATA_FILE.failed for diagnosis" >&2
            mv "$$DATA_FILE.partial" "$$DATA_FILE.failed" 2>/dev/null || true
          fi
          if [ "$${OPEN_WEBUI_BACKUP_PRUNE_DAYS:-0}" -ge 1 ]; then
            find "$$OPEN_WEBUI_BACKUPS_PATH" -type f \( -name "$$OPEN_WEBUI_BACKUP_NAME-*" -o -name "$$OPEN_WEBUI_DATA_BACKUP_NAME-*" \) -mtime "+$$OPEN_WEBUI_BACKUP_PRUNE_DAYS" -delete
          fi
          sleep "$$OPEN_WEBUI_BACKUP_INTERVAL"
        done
    volumes:
      - webui-data:/data
      - open-webui-backups:${OPEN_WEBUI_BACKUPS_PATH:-/srv/open-webui/backups}
    environment:
      OPEN_WEBUI_BACKUP_INIT_SLEEP: ${OPEN_WEBUI_BACKUP_INIT_SLEEP:-30m}
      OPEN_WEBUI_BACKUP_INTERVAL: ${OPEN_WEBUI_BACKUP_INTERVAL:-24h}
      OPEN_WEBUI_BACKUP_PRUNE_DAYS: ${OPEN_WEBUI_BACKUP_PRUNE_DAYS:-7}
      OPEN_WEBUI_BACKUPS_PATH: ${OPEN_WEBUI_BACKUPS_PATH:-/srv/open-webui/backups}
      OPEN_WEBUI_BACKUP_NAME: ${OPEN_WEBUI_BACKUP_NAME:-open-webui-database-backup}
      OPEN_WEBUI_DATA_BACKUP_NAME: ${OPEN_WEBUI_DATA_BACKUP_NAME:-open-webui-data-backup}
    restart: unless-stopped
