name: Deployment Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Daily rebuild: security patches should not wait for a weekly slot.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: deployment-verification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Authenticated requests avoid the anonymous API rate limit that shared
  # GitHub runners regularly hit (api.github.com answers 403 otherwise).
  GH_API_TOKEN: ${{ github.token }}

jobs:
  lint:
    name: Lint shell scripts and workflow YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck-alpine:stable \
            shellcheck ./*.sh

      - name: actionlint (GitHub Actions workflow linting)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            rhysd/actionlint:1.7.12 \
            -color

  scan-trivy:
    name: Scan pinned upstream image with Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    strategy:
      # Image refs are read from the compose file's x-images defaults at
      # runtime — single source of truth.
      fail-fast: false
      matrix:
        include:
          - name: ollama
            env_var: OLLAMA_IMAGE_TAG
          - name: webui
            env_var: WEBUI_IMAGE_TAG
          - name: traefik
            env_var: TRAEFIK_IMAGE_TAG

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned ${{ matrix.name }} image from the compose file
        id: pin
        env:
          ENV_VAR: ${{ matrix.env_var }}
        run: |
          image="$(grep -m1 -oE "\\$\\{${ENV_VAR}:-.*" ollama-traefik-letsencrypt-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
          if [ -z "$image" ]; then
            echo "${ENV_VAR} default not found in the compose x-images block" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Trivy scan of ${{ matrix.name }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.pin.outputs.image }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # FINDINGS DO NOT FAIL THIS STEP; A SCAN THAT CANNOT FINISH DOES.
          # Stated here rather than left to the action's default, because
          # this job no longer carries continue-on-error and the difference
          # now decides whether a red run means a new CVE upstream or a
          # scanner that died before it could report one.
          exit-code: "0"

      - name: Upload Trivy SARIF (${{ matrix.name }}) to GitHub Security
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

  deploy-and-test:
    name: docker compose up + Ollama API + WebUI HTTPS smoke
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      NETWORK_ONE: ollama-network
      NETWORK_TWO: traefik-network
      DOCKER_COMPOSE_FILE: ollama-traefik-letsencrypt-docker-compose.yml
      APP_HOSTNAME: ollama.heyvaldemar.net
      APP_TRAEFIK_HOSTNAME: traefik.ollama.heyvaldemar.net
      APP_API_HOSTNAME: ollama-api.heyvaldemar.net
      COMPOSE_PROJECT_NAME: ollama

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create necessary Docker networks
        run: |
          docker network create "$NETWORK_ONE" || true
          docker network create "$NETWORK_TWO" || true

      - name: Generate test .env with ephemeral credentials
        # The real .env is gitignored. CI generates throwaway credentials so
        # `docker compose up` succeeds without committing secrets to the
        # repo. No *_IMAGE_TAG values on purpose: the compose file's
        # x-images defaults apply, so CI always tests exactly the pins the
        # template ships to users who run it unmodified.
        run: |
          # A throwaway password for Ollama's API route: masked in the log, and
          # handed to curl through a file, never on a command line.
          api_password="$(openssl rand -hex 24)"
          echo "::add-mask::$api_password"
          api_hash="$(printf '%s' "$api_password" | openssl passwd -apr1 -stdin)"
          api_users="ollamaapi:${api_hash//\$/\$\$}"
          (umask 077; printf 'user = "ollamaapi:%s"\n' "$api_password" > "$RUNNER_TEMP/ollama-api.curl")
          cat > .env <<EOF
          TRAEFIK_ACME_EMAIL=ci@example.com
          TRAEFIK_HOSTNAME=${APP_TRAEFIK_HOSTNAME}
          TRAEFIK_BASIC_AUTH=traefikadmin:\$\$2y\$\$10\$\$sMzJfirKC75x/hVpiINeZOiSm.Jkity9cn4KwNkRvO7hSQVFc5FLO
          OLLAMA_HOSTNAME=${APP_HOSTNAME}
          # Skip multi-GB model downloads in CI; the template default installs models.
          OLLAMA_INSTALL_MODELS=
          OPEN_WEBUI_BACKUP_INIT_SLEEP=15s
          OPEN_WEBUI_BACKUP_INTERVAL=60s
          # Ollama's API route on, so the run can prove it refuses strangers.
          OLLAMA_API_ENABLED=true
          OLLAMA_API_HOSTNAME=${APP_API_HOSTNAME}
          OLLAMA_API_BASIC_AUTH=${api_users}
          EOF
          echo "Generated ephemeral .env for CI run"

      - name: Upgrade drill — the previous release comes up first, on the volumes this run will upgrade
        # A fresh stack proves the new image starts. It proves nothing about the
        # data a deployed host already has: whether the new database image accepts
        # the old data directory, whether the application's migrations run on a
        # populated schema. So the previous release is started first, on this
        # project's volumes, and the ordinary `up -d` below then recreates the
        # changed containers on top of it - which is exactly what `git pull &&
        # docker compose up -d` does on a deployed host. Every smoke check that
        # follows judges the upgraded stack, not a fresh one.
        run: |
          prev="$(git ls-remote --tags --sort=-v:refname origin 'v*' | grep -v '\^{}' | head -1 | sed 's|.*refs/tags/||')"
          if [ -z "$prev" ]; then
            echo "no previous release: nothing to upgrade from, the fresh start below is the whole test"
            exit 0
          fi
          git fetch --depth=1 --quiet origin "refs/tags/$prev:refs/tags/$prev"
          if git diff --quiet "$prev" -- "$DOCKER_COMPOSE_FILE"; then
            echo "the compose file is unchanged since $prev: nothing to drill"
            exit 0
          fi
          git show "$prev:$DOCKER_COMPOSE_FILE" > .upgrade-drill-previous.yml
          echo "starting $prev on this project's volumes"
          docker compose -f .upgrade-drill-previous.yml -p "$COMPOSE_PROJECT_NAME" up -d
          # Healthy means: every container is running and healthy (or running
          # with no health check), or exited 0 (a one-shot init container).
          bad=""
          for _ in $(seq 1 60); do
            bad="$(docker compose -f .upgrade-drill-previous.yml -p "$COMPOSE_PROJECT_NAME" ps -a --format json \
              | jq -rs '[.[] | select((.State == "running" and (.Health == "" or .Health == "healthy")) or (.State == "exited" and .ExitCode == 0) | not)] | map("\(.Service):\(.State)/\(.Health)") | join(" ")')"
            [ -z "$bad" ] && break
            sleep 10
          done
          if [ -n "$bad" ]; then
            echo "::error::the previous release ($prev) did not come up with this run's .env: $bad. Either the variable contract changed - then the changelog must say so - or $prev was never green here."
            docker compose -f .upgrade-drill-previous.yml -p "$COMPOSE_PROJECT_NAME" logs --tail 80
            exit 1
          fi
          echo "$prev is up and healthy; stopping it and keeping its volumes"
          docker compose -f .upgrade-drill-previous.yml -p "$COMPOSE_PROJECT_NAME" down
          rm -f .upgrade-drill-previous.yml
          echo "the start below is now an upgrade from $prev"

      - name: Start up services using Docker Compose
        run: docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" up -d

      - name: Every volume an image declares is one this stack names
        # A VOLUME the image declares and no mount covers becomes an anonymous
        # volume: it holds data, the backups never see it, and a down/up gives
        # the container an empty one. GLPI's data lived in one for six weeks in
        # 2026, under a named volume mounted where the image never reads.
        # Anonymous volumes this stack keeps on purpose are listed, with the
        # reason, in .github/anonymous-volumes as "service /path reason".
        run: |
          allowed="$(grep -vE '^[[:space:]]*(#|$)' .github/anonymous-volumes 2>/dev/null | awk '{print $1" "$2}' || true)"
          bad=""
          for c in $(docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME"); do
            svc="$(docker inspect -f '{{index .Config.Labels "com.docker.compose.service"}}' "$c")"
            for m in $(docker inspect -f '{{range .Mounts}}{{if eq .Type "volume"}}{{.Name}}={{.Destination}} {{end}}{{end}}' "$c"); do
              [[ "${m%%=*}" =~ ^[0-9a-f]{64}$ ]] || continue
              grep -qxF "$svc ${m#*=}" <<<"$allowed" || bad="$bad $svc:${m#*=}"
            done
          done
          if [ -n "$bad" ]; then
            echo "::error::anonymous volumes no named volume covers:$bad. Mount a named volume there, or list it in .github/anonymous-volumes with the reason."
            exit 1
          fi
          echo "every volume the images declare is named, or listed as anonymous on purpose"

      - name: Modify /etc/hosts for internal routing
        run: |
          echo "127.0.0.1 $APP_HOSTNAME" | sudo tee -a /etc/hosts
          echo "127.0.0.1 $APP_TRAEFIK_HOSTNAME" | sudo tee -a /etc/hosts
          echo "127.0.0.1 $APP_API_HOSTNAME" | sudo tee -a /etc/hosts

      - name: Print Docker Compose services status
        run: docker ps

      - name: Ollama answers nothing unauthenticated on the host
        # Ollama's API has no authentication: whoever reaches it can use the
        # machine's compute and pull or delete models.
        run: |
          if curl -s --max-time 5 "http://127.0.0.1:11434/api/version" >/dev/null; then
            echo "::error::Ollama answered on the host's port 11434 with no credentials: its API is published to anyone who reaches the port"
            exit 1
          fi
          echo "nothing answers on the host's port 11434"

      - name: Ollama's API route answers only with credentials
        # Switched on (OLLAMA_API_ENABLED=true in the test .env), the API is an
        # HTTPS route on its own hostname behind basic auth. Without the
        # password, reading the version and deleting a model both get 401.
        run: |
          # shellcheck disable=SC2016
          timeout 5m bash -c 'until curl -fsk --config "$RUNNER_TEMP/ollama-api.curl" "https://$APP_API_HOSTNAME/api/version" | grep -q version; do
            echo "Waiting for the Ollama API route..."
            sleep 10
          done'
          curl -fsk --config "$RUNNER_TEMP/ollama-api.curl" "https://$APP_API_HOSTNAME/api/version"
          echo
          for probe in "GET /api/version" "DELETE /api/delete"; do
            code="$(curl -sk -o /dev/null -w '%{http_code}' -X "${probe% *}" "https://$APP_API_HOSTNAME${probe#* }")"
            if [ "$code" != 401 ]; then
              echo "::error::$probe without credentials answered $code, not 401"
              exit 1
            fi
            echo "$probe without credentials: 401"
          done
          code="$(curl -sk -o /dev/null -w '%{http_code}' -u ollamaapi:wrong-password "https://$APP_API_HOSTNAME/api/version")"
          if [ "$code" != 401 ]; then
            echo "::error::a wrong password answered $code, not 401"
            exit 1
          fi
          echo "a wrong password: 401"

      - name: Ollama is not on the shared traefik-network
        # Every stack behind this Traefik joins traefik-network, and Ollama
        # answers anyone who reaches it, so it sits on ollama-network only. The
        # same probe must reach it from ollama-network, or its failure from
        # traefik-network proves nothing.
        run: |
          probe() { docker run --rm --network "$1" alpine:3.20 wget -q -T 5 -O- http://ollama:11434/api/version 2>&1 || true; }
          out="$(probe "$NETWORK_ONE")"
          if ! grep -q version <<<"$out"; then
            echo "::error::the probe cannot reach Ollama even from $NETWORK_ONE, so it proves nothing: $out"
            exit 1
          fi
          echo "from $NETWORK_ONE: $out"
          out="$(probe "$NETWORK_TWO")"
          if grep -q version <<<"$out"; then
            echo "::error::Ollama answered from $NETWORK_TWO, where every stack behind this Traefik can call it"
            exit 1
          fi
          echo "from $NETWORK_TWO: $out"

      - name: Set empty, OLLAMA_INSTALL_MODELS pulls nothing
        # The test .env sets it empty to skip the multi-GB downloads. Up to 1.x
        # the compose file read it with `:-`, which treats empty as unset, and
        # every run started pulling llama3 (4.7 GB) anyway.
        run: |
          # shellcheck disable=SC2016
          timeout 2m bash -c 'until docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs ollama 2>/dev/null | grep -q "All models installed"; do
            echo "Waiting for the model step of the entrypoint..."
            sleep 5
          done'
          pulls="$(docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs ollama 2>/dev/null | grep -c "Installing/Updating model" || true)"
          if [ "$pulls" != 0 ]; then
            echo "::error::OLLAMA_INSTALL_MODELS is set empty and the entrypoint still pulled $pulls model(s)"
            exit 1
          fi
          echo "no model pulled"

      - name: Wait for Open WebUI through Traefik
        run: |
          # shellcheck disable=SC2016
          timeout 8m bash -c 'while ! curl -fskL "https://$APP_HOSTNAME/" -o /dev/null; do
            echo "Waiting for Open WebUI..."
            sleep 10
          done'
          curl -fskL "https://$APP_HOSTNAME/" -o /dev/null -w "Open WebUI front page: %{http_code}\n"

      - name: Verify a backup is produced and valid
        # Log-driven: the file named in a 'backup OK' line is complete by
        # definition, so this never races an archive still being written.
        run: |
          # shellcheck disable=SC2016
          # The application creates its database on first start, later than the
          # first backup cycle; wait for the cycle that actually copied it.
          timeout 6m bash -c 'until docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs backups 2>/dev/null | grep -qE "Database backup (OK|FAILED)"; do echo "Waiting for a backup cycle that saw the database..."; sleep 10; done'
          db=$(docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs backups 2>/dev/null | grep "Database backup OK" | tail -1 | sed -E 's/.*Database backup OK: ([^ ]+) .*/\1/')
          [ -n "$db" ] || { echo "::error::no 'Database backup OK' line"; exit 1; }
          docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" exec -T backups sh -c "gunzip -c '$db' > /tmp/check.db && python3 -c \"import sqlite3; c=sqlite3.connect('/tmp/check.db'); r=c.execute('pragma integrity_check').fetchone()[0]; print('integrity:', r); raise SystemExit(0 if r=='ok' else 1)\"" && echo "Database backup valid: $db"
          data=$(docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs backups 2>/dev/null | grep "Data backup OK" | tail -1 | sed -E 's/.*Data backup OK: ([^ ]+) .*/\1/')
          [ -n "$data" ] || { echo "::error::no 'Data backup OK' line - the data archive failed"; exit 1; }
          docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" exec -T backups sh -c "tar -tzf '$data' > /dev/null" && echo "Data backup valid: $data"
          docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs backups 2>/dev/null | grep -i "backup FAILED" && { echo "::error::the backups log reports a failure"; exit 1; } || true

      - name: Run the backup/restore end-to-end tests
        # Scenarios against the live stack: required-env guard, backup set
        # produced, archive and database copy valid, failure detected when the
        # backups directory cannot be written, restore genuinely replaces the
        # data (application stopped, copy put back, marker gone), prune keeps
        # recent files. Same script a maintainer runs on a staging copy.
        run: |
          chmod +x tests/e2e-backup-restore.sh
          ./tests/e2e-backup-restore.sh

      - name: Wait for the Traefik dashboard to be ready
        run: |
          # shellcheck disable=SC2016
          timeout 5m bash -c 'while ! curl -fsSLk --write-out "%{http_code}" --output /dev/null "https://$APP_TRAEFIK_HOSTNAME" | grep -E "200|401"; do
            echo "Waiting for the dashboard to be ready..."
            sleep 10
          done'

      - name: Switched off, the API route is gone
        # OLLAMA_API_ENABLED=false (the default) must take the route away, not
        # merely leave it unused: Traefik answers 404 for the hostname, even
        # with the right password.
        run: |
          sed -i 's/^OLLAMA_API_ENABLED=.*/OLLAMA_API_ENABLED=false/' .env
          docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" up -d ollama
          code=""
          for _ in $(seq 1 12); do
            code="$(curl -sk -o /dev/null -w '%{http_code}' --config "$RUNNER_TEMP/ollama-api.curl" "https://$APP_API_HOSTNAME/api/version")"
            [ "$code" = 404 ] && break
            sleep 5
          done
          if [ "$code" != 404 ]; then
            echo "::error::with OLLAMA_API_ENABLED=false the API hostname still answers $code, not 404"
            exit 1
          fi
          echo "switched off: 404"
          curl -fskL "https://$APP_HOSTNAME/" -o /dev/null -w "Open WebUI front page after Ollama was recreated: %{http_code}\n"

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs

      - name: Shutdown Docker Compose services
        if: always()
        run: docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" down
