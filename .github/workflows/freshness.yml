name: Pin Freshness

# ITS OWN WORKFLOW, SO THE BADGE MEANS WHAT A READER THINKS IT MEANS.
#
# This job used to run inside Deployment Verification, whose badge is the one
# on the README and in the catalogue. It is a designed alarm: it goes red when
# a pin falls behind upstream, and the fleet's triage moves the pin within the
# day. Measured across the fleet over fourteen days, nine red runs in ten were
# this alarm and nothing else, and a visitor cannot tell "one version behind"
# from "does not boot". The job below is unchanged; only its address moved.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Daily rebuild: security patches should not wait for a weekly slot.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: pin-freshness-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Authenticated requests avoid the anonymous API rate limit that shared
  # GitHub runners regularly hit (api.github.com answers 403 otherwise).
  GH_API_TOKEN: ${{ github.token }}

jobs:
  check-pin-freshness:
    name: Check pinned images for upstream drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Scheduled + manual dispatch only: a new upstream release is not
    # actionable inside an unrelated PR. On the cron the failure lands as a
    # workflow-failure notification to the maintainer — a stale pin must
    # not sit unnoticed. Dependabot cannot see these pins (they are compose
    # interpolation defaults, not Dockerfile literals), so this job is the
    # actual tracking mechanism.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare pinned digests against what each tag resolves to now
        run: |
          status=0
          for var in OLLAMA_IMAGE_TAG WEBUI_IMAGE_TAG TRAEFIK_IMAGE_TAG; do
            pin="$(grep -m1 -oE "\\$\\{${var}:-.*" ollama-traefik-letsencrypt-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
            ref="${pin%%@*}"
            pinned_digest="${pin##*@}"
            # Three attempts: an unanswered registry lookup used to leave this empty,
            # and the comparison below then reported it as drift.
            current_digest=""
            for attempt in 1 2 3; do
              current_digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty')"
              [ -n "$current_digest" ] && break
              sleep $(( attempt * 5 ))
            done
            if [ -z "$current_digest" ]; then
              echo "::error::${ref} did not resolve after three attempts: the registry did not answer, or the tag is gone. The pin itself is unchanged."
              status=1
              continue
            fi
            if [ "$pinned_digest" != "$current_digest" ]; then
              echo "::error::${var} digest drift: pinned ${pinned_digest}, but ${ref} now resolves to ${current_digest}"
              status=1
            else
              echo "${var} OK (${ref})"
            fi
          done
          exit "$status"

      - name: Compare pinned Ollama version against the latest release
        # Runs even when the digest comparison above failed, so one run
        # reports every problem it can see instead of one per day.
        if: always()
        run: |
          pin="$(grep -m1 -oE '\$\{OLLAMA_IMAGE_TAG:-.*' ollama-traefik-letsencrypt-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
          ref="${pin%%@*}"
          pinned_version="${ref##*:}"
          latest="$(curl -fsSL --retry 3 -H "Authorization: Bearer $GH_API_TOKEN" https://api.github.com/repos/ollama/ollama/releases/latest | jq -r .tag_name)"
          latest="${latest#v}"
          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo "::error::Could not determine the latest Ollama release from the GitHub API"
            exit 1
          fi
          # ORDER, NOT INEQUALITY. `!=` calls any difference "behind", including
          # being ahead, and GitHub's releases/latest is the most recently
          # PUBLISHED release rather than the highest version. A project that
          # ships a maintenance release for an older branch after a newer one
          # then fails this check every day with a message asserting a direction
          # nothing here established. Nextcloud's pinned 34.0.3 was reported as
          # behind 32.0.15 until this was written. The leading v is stripped
          # before comparing because the two sides do not always carry it, and
          # sort -V is used because a string compare puts 3.10 below 3.7.
          p_cmp="${pinned_version#v}"; l_cmp="${latest#v}"
          if [ "$p_cmp" = "$l_cmp" ]; then
            echo "Ollama pin ${pinned_version} matches the latest release"
          elif [ "$(printf '%s\n%s\n' "$p_cmp" "$l_cmp" | sort -V | head -1)" = "$p_cmp" ]; then
            echo "::error::Ollama pin is behind: pinned ${pinned_version}, latest release is ${latest}"
            exit 1
          else
            echo "Ollama pin ${pinned_version} is ahead of the published ${latest}, which is what a maintenance release for an older branch looks like"
          fi

      - name: Compare pinned Open WebUI version against the latest release
        # Runs even when the digest comparison above failed, so one run
        # reports every problem it can see instead of one per day.
        if: always()
        # A FULL VERSION IS COMPARED AS ONE. From 2026-10-13 this step cut
        # both sides to major.minor, to stop it reading a full tag (0.12.0)
        # against a minor (0.12) as behind. It then read the full tag as its
        # line: 0.12.1 to 0.12.5 were published and it said "matches the
        # latest release line" over each, and once 0.13.0 was out the patches
        # of 0.12 were never named at all (2026-11-08). A minor tag (0.11)
        # still compares as a line, because its digest moves with each patch
        # and the digest step above reads that.
        run: |
          pin="$(grep -m1 -oE '\$\{WEBUI_IMAGE_TAG:-.*' ollama-traefik-letsencrypt-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
          ref="${pin%%@*}"
          pinned="${ref##*:}"; pinned="${pinned#v}"
          latest="$(curl -fsSL --retry 3 -H "Authorization: Bearer $GH_API_TOKEN" https://api.github.com/repos/open-webui/open-webui/releases/latest | jq -r .tag_name)"
          latest="${latest#v}"
          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo "::error::Could not determine the latest Open WebUI release from the GitHub API"
            exit 1
          fi
          case "$pinned" in
            *.*.*)
              # Order, not inequality, for the reason the Ollama step gives.
              if [ "$pinned" = "$latest" ]; then
                echo "Open WebUI pin ${pinned} matches the latest release"
              elif [ "$(printf '%s\n%s\n' "$pinned" "$latest" | sort -V | head -1)" = "$pinned" ]; then
                echo "::error::Open WebUI pin is behind: pinned ${pinned}, latest release is ${latest}"
                exit 1
              else
                echo "Open WebUI pin ${pinned} is ahead of the published ${latest}, which is what a maintenance release for an older branch looks like"
              fi
              ;;
            *)
              if [ "$pinned" != "${latest%.*}" ]; then
                echo "::error::Open WebUI pin is behind: pinned minor ${pinned}, latest release is ${latest}"
                exit 1
              fi
              echo "Open WebUI pin ${pinned} matches the latest release line (${latest})"
              ;;
          esac

      - name: Compare pinned Traefik minor against the latest release
        # Runs even when the digest comparison above failed, so one run
        # reports every problem it can see instead of one per day.
        if: always()
        run: |
          pin="$(grep -m1 -oE '\$\{TRAEFIK_IMAGE_TAG:-.*' ollama-traefik-letsencrypt-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
          ref="${pin%%@*}"
          pinned_minor="${ref##*:}"
          latest="$(curl -fsSL --retry 3 -H "Authorization: Bearer $GH_API_TOKEN" https://api.github.com/repos/traefik/traefik/releases/latest | jq -r .tag_name)"
          latest="${latest#v}"
          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            echo "::error::Could not determine the latest Traefik release from the GitHub API"
            exit 1
          fi
          case "$latest" in
            "$pinned_minor".*) echo "Traefik pin ${pinned_minor} matches the latest release line (${latest})" ;;
            *) echo "::error::Traefik pin is behind: pinned minor ${pinned_minor}, latest release is ${latest}"; exit 1 ;;
          esac
